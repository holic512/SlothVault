# @file docker-compose.yml
# @project SlothVault
# @module SQLite container deployment
# @description Runs the SQLite-specific SlothVault deployment with a mode-isolated local application data directory.
# @logic Persist the complete application data root, opt into the Compose database bootstrap, and start no external database service.
# @dependencies Docker Compose, SlothVault image, SQLite
# @index_tags docker,compose,sqlite,bootstrap,persistence
# @author holic512

name: slothvault-sqlite

services:
  slothvault:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${DOCKER_IMAGE:-holic512/slothvault:latest}
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - ${APP_DATA_DIR:-./docker-data/sqlite/app}:/app/data
    environment:
      APP_DATA_PATH: /app/data
      UPLOAD_STORAGE_PATH: /app/data/uploads
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      SLOTHVAULT_AUTO_BOOTSTRAP: "1"
      SLOTHVAULT_BOOTSTRAP_PROVIDER: sqlite
