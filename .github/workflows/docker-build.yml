# @file .github/workflows/docker-build.yml
# @project SlothVault
# @module Container and source release delivery
# @description Validates pull-request images and publishes the default-branch Docker image with per-platform size metrics, one immutable build identity, a source GitHub Release, and a self-contained host deployment ZIP.
# @logic Generate one version/build/SHA identity before building, embed it in the multi-architecture image and deployment ZIP, report compressed-size deltas, then refresh the idempotent Release with first-parent commit logs.
# @dependencies GitHub Actions, Docker Buildx, Docker Hub, Node.js, GitHub CLI, deploy/
# @index_tags github-actions,docker,standalone,image-size,release,build-identity,source-archive,deployment,zip,commit-log
# @author holic512

name: Build Docker Image and Publish Release

on:
  pull_request:
    branches:
      - master
      - main
  push:
    branches:
      - master
      - main

concurrency:
  group: docker-release-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ vars.DOCKER_IMAGE_NAME || 'holic512/slothvault' }}
  DOCKER_BUILD_RECORD_UPLOAD: "false"
  BUILDKIT_PROGRESS: plain

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # A normal multi-platform build completed in about 16 minutes. Stop a
    # stuck Buildx/cache request with useful plain-text logs instead of waiting
    # for the GitHub-hosted runner's 6-hour hard limit.
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Prepare immutable release identity
        id: release-identity
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}-build.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Capture previous image sizes
        id: previous-size
        if: github.event_name != 'pull_request'
        env:
          IMAGE_REFERENCE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
        run: >-
          node scripts/docker-image-size.mjs "$IMAGE_REFERENCE"
          --github-output "$GITHUB_OUTPUT"
          --allow-missing

      - name: Build Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SLOTHVAULT_APP_VERSION=${{ steps.release-identity.outputs.version }}
            SLOTHVAULT_RELEASE_TAG=${{ steps.release-identity.outputs.tag }}
            SLOTHVAULT_RELEASE_COMMIT_SHA=${{ github.sha }}
            SLOTHVAULT_RELEASE_REPOSITORY=holic512/SlothVault
          # Start with a fresh scope after the previous shared cache stalled.
          # Bound cache API work; an export problem must not block publishing.
          cache-from: type=gha,scope=slothvault-build-v2,timeout=5m
          cache-to: type=gha,scope=slothvault-build-v2,mode=min,timeout=5m,ignore-error=true
          provenance: false

      - name: Inspect published image sizes
        id: image-size
        if: github.event_name != 'pull_request'
        env:
          IMAGE_REFERENCE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: >-
          node scripts/docker-image-size.mjs "$IMAGE_REFERENCE"
          --github-output "$GITHUB_OUTPUT"

      - name: Generate deployment summary
        env:
          AMD64_BYTES: ${{ steps.image-size.outputs.amd64_bytes }}
          AMD64_MIB: ${{ steps.image-size.outputs.amd64_mib }}
          AMD64_PREVIOUS_BYTES: ${{ steps.previous-size.outputs.amd64_bytes }}
          ARM64_BYTES: ${{ steps.image-size.outputs.arm64_bytes }}
          ARM64_MIB: ${{ steps.image-size.outputs.arm64_mib }}
          ARM64_PREVIOUS_BYTES: ${{ steps.previous-size.outputs.arm64_bytes }}
        run: |
          size_delta() {
            current="$1"
            previous="$2"
            if [ -z "$previous" ]; then
              echo "n/a"
              return
            fi
            awk -v current="$current" -v previous="$previous" \
              'BEGIN { printf "%+.1f MiB (%+.1f%%)", (current - previous) / 1048576, (current - previous) * 100 / previous }'
          }

          echo "## Docker Image Build" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Mode" >> $GITHUB_STEP_SUMMARY
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "- Build validation only; image was not pushed." >> $GITHUB_STEP_SUMMARY
          else
            echo "- Built and pushed to Docker Hub." >> $GITHUB_STEP_SUMMARY
            echo "- Digest: \`${{ steps.build.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Compressed Image Size" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Platform | Size | Change |" >> $GITHUB_STEP_SUMMARY
            echo "| --- | ---: | ---: |" >> $GITHUB_STEP_SUMMARY
            echo "| linux/amd64 | ${AMD64_MIB} MiB (${AMD64_BYTES} bytes) | $(size_delta "$AMD64_BYTES" "$AMD64_PREVIOUS_BYTES") |" >> $GITHUB_STEP_SUMMARY
            echo "| linux/arm64 | ${ARM64_MIB} MiB (${ARM64_BYTES} bytes) | $(size_delta "$ARM64_BYTES" "$ARM64_PREVIOUS_BYTES") |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Image Tags" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Architecture" >> $GITHUB_STEP_SUMMARY
          echo "- linux/amd64" >> $GITHUB_STEP_SUMMARY
          echo "- linux/arm64" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Docker Compose Install" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "curl -fL https://github.com/${{ github.repository }}/releases/latest/download/slothvault-deploy.zip -o slothvault-deploy.zip" >> $GITHUB_STEP_SUMMARY
          echo "python3 -m zipfile -e slothvault-deploy.zip ." >> $GITHUB_STEP_SUMMARY
          echo "sudo python3 deploy/install.py" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  publish-release:
    name: Publish source release and deployment package
    needs: build-and-push
    if: >-
      github.event_name == 'push' &&
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository history
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Prepare immutable release identity
        id: release-identity
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}-build.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Generate release commit log
        id: release
        shell: bash
        run: |
          set -euo pipefail

          version="${{ steps.release-identity.outputs.version }}"
          tag="${{ steps.release-identity.outputs.tag }}"
          title="SlothVault ${version} · Build ${GITHUB_RUN_NUMBER}"
          previous_tag=""

          while IFS= read -r candidate; do
            if [ "$candidate" != "$tag" ]; then
              previous_tag="$candidate"
              break
            fi
          done < <(git tag --merged "$GITHUB_SHA" --sort=-creatordate)

          {
            echo "## 提交日志"
            echo
            if [ -n "$previous_tag" ]; then
              git log "${previous_tag}..${GITHUB_SHA}" --first-parent --pretty=format:'- `%h` %s'
            else
              git log "$GITHUB_SHA" --first-parent -n 50 --pretty=format:'- `%h` %s'
            fi
            echo
          } > release-notes.md

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "title=$title" >> "$GITHUB_OUTPUT"

      - name: Create source GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_TITLE: ${{ steps.release.outputs.title }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "$RELEASE_TITLE" \
              --notes-file release-notes.md
          else
            gh release create "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TITLE" \
              --notes-file release-notes.md
          fi

      - name: Build deployment package archive
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_REPOSITORY: holic512/SlothVault
          RELEASE_COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          package_root="$RUNNER_TEMP/slothvault-deploy-package"
          rm -rf "$package_root"
          mkdir -p "$package_root/deploy"
          git archive "${GITHUB_SHA}:deploy" | tar -x -C "$package_root/deploy"
          export RELEASE_METADATA_PATH="$package_root/deploy/slothvault_deploy/release_metadata.py"
          python3 - <<'PY'
          import os
          from pathlib import Path

          source = (
              '"""Generated immutable Release identity for a SlothVault deployment package."""\n'
              "from __future__ import annotations\n\n"
              "RELEASE_TAG = {0!r}\n"
              "RELEASE_COMMIT_SHA = {1!r}\n"
              "RELEASE_REPOSITORY = {2!r}\n"
          ).format(
              os.environ["RELEASE_TAG"],
              os.environ["RELEASE_COMMIT_SHA"],
              os.environ["RELEASE_REPOSITORY"],
          )
          Path(os.environ["RELEASE_METADATA_PATH"]).write_text(source, encoding="utf-8")
          PY
          (
            cd "$package_root"
            zip -qr "$GITHUB_WORKSPACE/slothvault-deploy.zip" deploy
          )

      - name: Upload host deployment package
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: gh release upload "$RELEASE_TAG" ./slothvault-deploy.zip --clobber

      - name: Generate release summary
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          echo "## Source Release" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tag: \`$RELEASE_TAG\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Notes: first-parent commit log only." >> "$GITHUB_STEP_SUMMARY"
          echo "- Assets: GitHub-generated source ZIP and tar.gz, plus \`slothvault-deploy.zip\` containing the self-contained host deployment package." >> "$GITHUB_STEP_SUMMARY"
