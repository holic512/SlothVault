# @file .github/workflows/docker-build.yml
# @project SlothVault
# @module Native container and application release delivery
# @description Validates native amd64/arm64 images and publishes immutable application releases.
# @logic Pin and validate source, smoke-test both architectures, merge verified digests, attach every source plugin, complete the Release, then safely promote latest.
# @dependencies GitHub Actions, Docker Buildx, Docker Hub, release-delivery, docker-smoke
# @index_tags github-actions,docker,arm64,release,manifest,recovery
# @author holic512

name: Build Docker Image and Publish Release

on:
  pull_request:
    branches: [master, main]
    paths-ignore:
      - 'integrations/**'
      - 'plugins/README.md'
      - 'plugins/release.mjs'
      - '.github/workflows/release-vault-module.yml'
      - '.github/workflows/release-skill.yml'
      - '.github/workflows/release-deployment.yml'
      - '.github/workflows/release-plugins.yml'
  push:
    branches: [master, main]
    paths-ignore:
      - 'integrations/**'
      - 'plugins/README.md'
      - 'plugins/release.mjs'
      - '.github/workflows/release-vault-module.yml'
      - '.github/workflows/release-skill.yml'
      - '.github/workflows/release-deployment.yml'
      - '.github/workflows/release-plugins.yml'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Full commit SHA or application version Tag to retry (empty: current commit)'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: application-release-${{ github.event_name == 'pull_request' && github.ref || github.event.repository.default_branch }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_REPOSITORY: docker.io/${{ vars.DOCKER_IMAGE_NAME || 'holic512/slothvault' }}
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
  DOCKER_BUILD_RECORD_UPLOAD: 'false'
  BUILDKIT_PROGRESS: plain

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.identity.outputs.sha }}
      version: ${{ steps.identity.outputs.version }}
      tag: ${{ steps.identity.outputs.tag }}
      plugin_assets: ${{ steps.identity.outputs.plugin_assets }}
      publish: ${{ steps.identity.outputs.publish }}
      reuse: ${{ steps.image.outputs.reuse }}
      amd64_digest: ${{ steps.image.outputs.amd64_digest }}
      arm64_digest: ${{ steps.image.outputs.arm64_digest }}
    steps:
      - name: Checkout delivery tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Checkout candidate source and history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          path: source
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
      - name: Validate immutable release identity and committed versions
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REF: ${{ inputs.ref || '' }}
          PUBLISH_REQUEST: ${{ github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch }}
        run: node scripts/release-delivery.mjs prepare --root source
      - name: Checkout resolved immutable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.identity.outputs.sha }}
          path: source
          fetch-depth: 0
      - name: Verify generated MCP documentation
        working-directory: source
        run: node scripts/generate-mcp-docs.mjs --check
      - name: Set up Buildx for existing version inspection
        if: steps.identity.outputs.publish == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Check for a reusable complete version image
        if: steps.identity.outputs.publish == 'true'
        id: image
        run: node scripts/release-delivery.mjs image-state --root source
      - name: Store immutable identity
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: application-identity
          path: dist/application/identity.json
          if-no-files-found: error
          retention-days: 7

  verify-plugins:
    needs: validate
    uses: ./.github/workflows/verify-plugins.yml
    with:
      source_ref: ${{ needs.validate.outputs.sha }}

  build:
    needs: [validate, verify-plugins]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout delivery tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Checkout immutable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          path: source
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: application-identity
          path: dist/application
      - name: Set up native Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Log in for digest publication
        if: needs.validate.outputs.publish == 'true' && needs.validate.outputs.reuse != 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build native image
        if: needs.validate.outputs.reuse != 'true'
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: source
          platforms: linux/${{ matrix.arch }}
          outputs: ${{ needs.validate.outputs.publish == 'true' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE_REPOSITORY) || 'type=docker' }}
          tags: ${{ needs.validate.outputs.publish != 'true' && format('slothvault-check:{0}-{1}', needs.validate.outputs.tag, matrix.arch) || '' }}
          build-args: |
            SLOTHVAULT_APP_VERSION=${{ needs.validate.outputs.version }}
            SLOTHVAULT_RELEASE_TAG=${{ needs.validate.outputs.tag }}
            SLOTHVAULT_RELEASE_COMMIT_SHA=${{ needs.validate.outputs.sha }}
            SLOTHVAULT_RELEASE_REPOSITORY=${{ github.repository }}
          cache-from: type=gha,scope=slothvault-${{ matrix.arch }}-v3,timeout=5m
          cache-to: type=gha,scope=slothvault-${{ matrix.arch }}-v3,mode=min,timeout=5m,ignore-error=true
          provenance: false
      - name: Verify native runtime and pinned source
        env:
          PUBLISH_REQUEST: ${{ needs.validate.outputs.publish }}
          PLATFORM: linux/${{ matrix.arch }}
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.validate.outputs.version }}
          TAG: ${{ needs.validate.outputs.tag }}
          COMMIT_SHA: ${{ needs.validate.outputs.sha }}
          PLATFORM_DIGEST: ${{ steps.build.outputs.digest || (matrix.arch == 'amd64' && needs.validate.outputs.amd64_digest || needs.validate.outputs.arm64_digest) }}
        run: |
          set -euo pipefail
          if [ "$PUBLISH_REQUEST" = true ]; then
            image="$IMAGE_REPOSITORY@$PLATFORM_DIGEST"
            docker pull --platform "$PLATFORM" "$image"
          else
            image="slothvault-check:$TAG-$ARCH"
          fi
          node scripts/docker-smoke.mjs "$image" "$PLATFORM" "$VERSION" "$TAG" "$COMMIT_SHA"
          if [ "$PUBLISH_REQUEST" = true ]; then
            node scripts/release-delivery.mjs record-platform --root source --platform "$PLATFORM" --digest "$PLATFORM_DIGEST"
          fi
      - name: Store verified native digest
        if: needs.validate.outputs.publish == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: application-digest-${{ matrix.arch }}
          path: dist/application/platform-${{ matrix.arch }}.json
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish complete application and promote latest
    needs: [validate, build]
    if: needs.validate.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout delivery tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Checkout immutable source history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          path: source
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: application-identity
          path: dist/application
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: application-digest-*
          merge-multiple: true
          path: dist/digests
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Download every source plugin from the pinned verification job
        if: needs.validate.outputs.plugin_assets == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: application-plugins
          path: dist/application
      - name: Capture historical size baseline
        run: node scripts/docker-image-size.mjs "$IMAGE_REPOSITORY:latest" --allow-partial --allow-missing > dist/application/previous-sizes.json
      - name: Merge verified platforms or verify existing version image
        run: node scripts/release-delivery.mjs merge-images --root source --digests ../dist/digests
      - name: Complete immutable application Release
        run: node scripts/release-delivery.mjs publish --root source
      - name: Promote newest successful application
        run: node scripts/release-delivery.mjs promote --root source
      - name: Record deployment and size summary
        if: always()
        run: node scripts/release-delivery.mjs summary --root source
