# @file .github/workflows/release-skill.yml
# @project SlothVault
# @module Independent skill release entry
# @description Validates relevant changes and supports immutable manual delivery retries.
# @logic Dispatch the module and optional pinned source to the shared validation, packaging and publication workflow.
# @dependencies GitHub Actions, release-vault-module
# @index_tags release,skill,workflow-dispatch
# @author holic512

name: Release SlothVault Skill
on:
  pull_request:
    paths:
      - 'integrations/skill/**'
      - 'integrations/protocol/**'
      - 'integrations/scripts/**'
      - 'scripts/release-version.mjs'
      - 'scripts/release-version.test.mjs'
      - 'scripts/release-delivery.mjs'
      - 'scripts/release-delivery.test.mjs'
      - '.github/workflows/release-skill.yml'
      - '.github/workflows/release-vault-module.yml'
  push:
    branches: [master, main]
    paths:
      - 'integrations/skill/**'
      - 'integrations/protocol/**'
      - 'integrations/scripts/**'
      - 'scripts/release-version.mjs'
      - 'scripts/release-version.test.mjs'
      - 'scripts/release-delivery.mjs'
      - 'scripts/release-delivery.test.mjs'
      - '.github/workflows/release-skill.yml'
      - '.github/workflows/release-vault-module.yml'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Full commit SHA or module version Tag to retry (empty: current commit)'
        type: string
        default: ''
permissions:
  contents: read
jobs:
  release:
    permissions:
      contents: write
    uses: ./.github/workflows/release-vault-module.yml
    with:
      module: skill
      ref: ${{ inputs.ref || '' }}
