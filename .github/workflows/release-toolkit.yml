# @file release-toolkit.yml
# @project SlothVault
# @module External toolkit release
# @description Validates and publishes the SlothTool-managed MCP client, Skill, and deployment runtime independently of the application image.
# @logic Check the lockfile and Skill digests, pack one immutable runtime archive, hash it, then publish a toolkit-prefixed GitHub Release.
# @dependencies GitHub Actions, npm, integrations/slothvault-runtime
# @index_tags toolkit,release,mcp,skill,deploy
# @author holic512

name: Release SlothVault Toolkit

on:
  pull_request:
    branches: [master, main]
    paths:
      - 'integrations/slothvault-runtime/**'
      - '.github/workflows/release-toolkit.yml'
  push:
    branches: [master, main]
    paths:
      - 'integrations/slothvault-runtime/**'
      - '.github/workflows/release-toolkit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  toolkit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install locked dependencies
        working-directory: integrations/slothvault-runtime
        run: npm ci --ignore-scripts
      - name: Validate runtime and Skill
        working-directory: integrations/slothvault-runtime
        run: |
          node scripts/skill-metadata.js --check
          node --check bin/slothvault-mcp.js
          node --check bin/slothvault-runtime.js
          npm test
          PYTHONDONTWRITEBYTECODE=1 python3 deploy/tests/deploy_installer_test.py
      - name: Pack and publish
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        working-directory: integrations/slothvault-runtime
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="toolkit-v${version}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "Release tag already exists: ${tag}" >&2
            exit 1
          fi
          archive="$(npm pack --json | node -e "let raw='';process.stdin.on('data',part=>raw+=part).on('end',()=>console.log(JSON.parse(raw)[0].filename))")"
          ARCHIVE="$archive" node --input-type=module -e '
            import {createHash} from "node:crypto";
            import {readFileSync, writeFileSync} from "node:fs";
            const pkg = JSON.parse(readFileSync("package.json", "utf8"));
            const skill = JSON.parse(readFileSync("skill-release.json", "utf8"));
            const archive = process.env.ARCHIVE;
            const manifest = {schema: 1, packageName: pkg.name, version: pkg.version,
              asset: archive, sha256: createHash("sha256").update(readFileSync(archive)).digest("hex"),
              adapterApiMajor: 1, skillVersion: skill.skillVersion};
            writeFileSync("slothvault-toolkit.json", JSON.stringify(manifest, null, 2) + "\n");
          '
          gh release create "$tag" "$archive" slothvault-toolkit.json \
            --repo holic512/SlothVault --target "$RELEASE_COMMIT" \
            --title "SlothVault Toolkit ${version}" \
            --notes "SlothTool-managed MCP client, Skill, and deployment runtime."
